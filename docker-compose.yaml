services:
  laravel:
    build:
      context: .
      dockerfile: dockerfile
    container_name: laradev
    restart: unless-stopped
    working_dir: /var/www/html
    # volumes:
    #   - ./:/var/www/html
      # - ./laravel.conf:/etc/nginx/conf.d/default.conf
    # ports:
    #   - "8080:80" # Map port 80 on the host to the container's port 80
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION}
      - SESSION_DRIVER=${SESSION_DRIVER}
    # networks: # Comment out if you don't have a reverse proxy setup
    #   - proxy-network

