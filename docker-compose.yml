services:
  laravel:
    image: serversideup/php:8.3-fpm-nginx
    container_name: flai
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./laravel.conf:/etc/nginx/conf.d/default.conf
    # ports:
      # - "8080:80" # Map port 8080 on the host to the container's port 80
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
    networks: # Comment out if you don't have a reverse proxy setup
      - proxy-network

# Comment out if you don't have a reverse proxy setup
networks:
  proxy-network:
    name: nginx_proxy-network
    external: true