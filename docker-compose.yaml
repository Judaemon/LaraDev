version: '3.8'

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev  # Change this to "prod" when building for production
      args:
        DEV_MODE: "true"
    container_name: laradev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # - ./laravel.conf:/etc/nginx/conf.d/default.conf
      - ./laravel.conf:/etc/nginx/conf.d/laravel.conf 
    #   - ./:/var/www/html:cached   # Enables hot-reloading for development
    #   - /var/www/html/node_modules  # Prevent host/node_modules conflicts
    #   - /var/www/html/vendor        # Prevent host/vendor conflicts
    ports:
      - "8080"
    #   - "5173:5173"  # For Vite/HMR if using frontend scaffolding
    env_file:
      - ${ENV_FILE:-.env}  # Pass in dev.env, staging.env, or prod.env defaults to .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
