services:
  laravel:
    build:
      context: .
      dockerfile: dockerfile
    container_name: laradev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # - ./laravel.conf:/etc/nginx/conf.d/default.conf
    # ports:
    #   - "8080:80" # Map port 80 on the host to the container's port 80
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
    # networks: # Comment out if you don't have a reverse proxy setup
    #   - proxy-network

# # Comment out if you don't have a reverse proxy setup
# networks:
#   proxy-network:
#     name: nginx_proxy-network
#     external: true